name: Ghosium Windows Update Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'VERSION'
      - 'installer/**'
      - 'updates-web/**'
      - 'scripts/generate-update-manifest.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - '.github/workflows/ghosium-0.0.3-production-release.yml'
      - '.github/workflows/update-contract.yml'
  push:
    branches: [main]
    paths:
      - 'VERSION'
      - 'installer/**'
      - 'updates-web/**'
      - 'scripts/generate-update-manifest.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - '.github/workflows/ghosium-0.0.3-production-release.yml'
      - '.github/workflows/update-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  update-contract:
    name: Verify fail-closed Windows package updater
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate update scripts
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @('scripts/generate-update-manifest.ps1','scripts/smoke-test-windows-installer.ps1')) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile((Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) { throw "PowerShell parser errors found in $path" }
          }

      - name: Validate fail-closed update web
        shell: bash
        run: |
          set -euo pipefail
          php -l updates-web/index.php
          php -l updates-web/health.php
          python3 - <<'PY'
          import json
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          manifest = json.loads(Path('updates-web/windows/stable.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1,
              'product': 'Ghosium Browser',
              'platform': 'windows',
              'channel': 'stable',
              'enabled': False,
              'version': version,
              'url': 'https://updates.ghosium.com/windows/Ghosium-Browser-Setup.exe',
              'sha256': '',
              'size': 0,
              'release_notes': f'https://ghosium.com/release-notes/{version}',
          }
          if manifest != expected:
              raise SystemExit(f'Fail-closed update baseline mismatch: {manifest}')
          PY
          grep -Fq 'Options -Indexes' updates-web/.htaccess
          grep -Fq 'Header always set Cache-Control "no-store, no-cache, must-revalidate, max-age=0"' updates-web/.htaccess

      - name: Verify deterministic release manifest generation
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $dir = Join-Path $env:RUNNER_TEMP 'ghosium-update-manifest-test'
          New-Item -ItemType Directory -Force -Path $dir | Out-Null
          $setup = Join-Path $dir 'Ghosium-Browser-Setup.exe'
          [IO.File]::WriteAllBytes($setup, [Text.Encoding]::UTF8.GetBytes('deterministic Ghosium setup test payload'))
          $output = Join-Path $dir 'stable.json'
          ./scripts/generate-update-manifest.ps1 -SetupPath $setup -OutputPath $output
          $manifest = Get-Content $output -Raw | ConvertFrom-Json
          $expectedHash = (Get-FileHash $setup -Algorithm SHA256).Hash.ToLowerInvariant()
          if (!$manifest.enabled -or $manifest.version -ne (Get-Content VERSION -Raw).Trim() -or $manifest.sha256 -ne $expectedHash -or [int64]$manifest.size -ne (Get-Item $setup).Length) {
            throw 'Generated Windows update manifest failed deterministic verification.'
          }

      - name: Verify secure same-Setup maintenance path
        shell: python
        run: |
          from pathlib import Path
          text = Path('installer/ghosium.nsi').read_text(encoding='utf-8')
          required = (
              '${GetOptions} $R0 "/UPDATE" $R1',
              '${GetOptions} $R0 "/UNINSTALL" $R1',
              '${GetOptions} $R0 "/CLEANUPDATE=" $R1',
              'StrCmp $R6 "Ghosium-Browser-Setup.exe" 0 update_cleanup_invalid',
              'Delete /REBOOTOK "$R5"',
              'RMDir /REBOOTOK "$R6"',
          )
          for token in required:
              if token not in text:
                  raise SystemExit(f'Secure same-Setup update contract missing: {token}')
          if any(token.lower() in text.lower() for token in ('Ghosium-Updater.exe','Ghosium-Update.exe','WriteUninstaller')):
              raise SystemExit('Standalone maintenance executable contract returned.')

      - name: Verify production updater binds to signed Windows packages
        shell: python
        run: |
          from pathlib import Path
          production = Path('.github/workflows/ghosium-0.0.3-production-release.yml').read_text(encoding='utf-8')
          for required in (
              'GHOSIUM_SIGN_CERT_THUMBPRINT',
              'GHOSIUM_TIMESTAMP_URL',
              'signtool.exe',
              'Ghosium-Browser-Setup.exe',
              'Ghosium-Browser-Portable.exe',
              'Get-AuthenticodeSignature',
          ):
              if required not in production:
                  raise SystemExit(f'Production update/signing invariant missing: {required}')
