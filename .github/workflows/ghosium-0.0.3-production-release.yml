name: Ghosium 0.0.3 Windows Production Release

on:
  push:
    branches: [main]
    paths:
      - '.release/ghosium-v0.0.3-preview.1-preview.1.request'

concurrency:
  group: ghosium-0.0.3-windows-production
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  dispatch-windows-production:
    name: Run exact Tor Browser Windows source build
    runs-on: ubuntu-24.04
    timeout-minutes: 480
    permissions:
      actions: write
      contents: read
    outputs:
      run_id: ${{ steps.windows.outputs.run_id }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Validate exact Windows-only release request
        shell: python
        run: |
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          marker = Path('.release/ghosium-v0.0.3-preview.1-preview.1.request').read_text(encoding='utf-8').strip()
          if version != '0.0.3' or marker != 'ghosium-v0.0.3-preview.1':
              raise SystemExit(f'Invalid production release request: {version!r} / {marker!r}')
          if Path('android').exists():
              raise SystemExit('Windows-only release contains Android source.')
      - name: Dispatch exact Tor Browser Windows build
        id: windows
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag='ghosium-v0.0.3-preview.1'
          if gh release view "$tag" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Release $tag already exists; refusing overwrite." >&2
            exit 1
          fi
          started="$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          gh workflow run tor-browser-windows-build.yml --ref main --repo "$GITHUB_REPOSITORY"
          run_id=''
          for attempt in $(seq 1 30); do
            run_id="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/tor-browser-windows-build.yml/runs?branch=main&event=workflow_dispatch&per_page=30" --jq ".workflow_runs | map(select(.head_sha == \"$GITHUB_SHA\" and .created_at >= \"$started\")) | sort_by(.created_at) | last | .id // empty")"
            [[ -n "$run_id" ]] && break
            sleep 5
          done
          [[ -n "$run_id" ]] || { echo 'Could not identify exact Tor Browser Windows run.' >&2; exit 1; }
          echo "run_id=$run_id" >> "$GITHUB_OUTPUT"
          gh run watch "$run_id" --repo "$GITHUB_REPOSITORY" --exit-status

  sign-and-publish:
    name: Sign and publish Windows-only Ghosium 0.0.3
    needs: dispatch-windows-production
    runs-on: [self-hosted, windows, x64, ghosium-source-builder]
    timeout-minutes: 90
    permissions:
      actions: read
      contents: write
    env:
      GHOSIUM_SIGN_CERT_THUMBPRINT: ${{ secrets.GHOSIUM_SIGN_CERT_THUMBPRINT }}
      GHOSIUM_TIMESTAMP_URL: ${{ vars.GHOSIUM_TIMESTAMP_URL }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Download exact source-built engine artifact
        uses: actions/download-artifact@634f93cb2916e3fdff6788551b99b062d0335ce0 # v5
        with:
          name: ghosium-tor-browser-engine-windows-x64-0.0.3
          path: artifacts/engine
          run-id: ${{ needs.dispatch-windows-production.outputs.run_id }}
          github-token: ${{ github.token }}
      - name: Stage runtime and compile Ghosium launcher
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $PWD 'artifacts/stage'
          $runtime = Join-Path $stage 'runtime'
          New-Item -ItemType Directory -Force -Path $runtime,'artifacts/public' | Out-Null
          $package = Get-ChildItem 'artifacts/engine' -File -Filter '*.zip' | Select-Object -First 1
          if (!$package) { throw 'Exact source-built Windows engine package is missing.' }
          Expand-Archive -Path $package.FullName -DestinationPath 'artifacts/unpacked' -Force
          $firefox = Get-ChildItem 'artifacts/unpacked' -Filter 'firefox.exe' -File -Recurse | Select-Object -First 1
          if (!$firefox) { throw 'Source-built engine does not contain firefox.exe.' }
          Copy-Item (Join-Path $firefox.Directory.FullName '*') $runtime -Recurse -Force
          Copy-Item LICENSE,THIRD_PARTY_NOTICES.md,PRIVACY.md,SECURITY.md $stage -Force
          ./compat-preview/vendor/build-native-launcher.ps1 -Version '0.0.3' -OutputPath (Join-Path $stage 'Ghosium-Browser.exe')
          if ($LASTEXITCODE -ne 0) { throw 'Ghosium launcher compile failed.' }
      - name: Resolve signing identity and sign runtime executables
        id: sign
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:GHOSIUM_SIGN_CERT_THUMBPRINT)) { throw 'GHOSIUM_SIGN_CERT_THUMBPRINT is required.' }
          if ([string]::IsNullOrWhiteSpace($env:GHOSIUM_TIMESTAMP_URL)) { throw 'GHOSIUM_TIMESTAMP_URL is required.' }
          $thumb = ($env:GHOSIUM_SIGN_CERT_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          if ($thumb -notmatch '^[0-9A-F]{40}$') { throw 'Invalid signing certificate thumbprint.' }
          $userCert = Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $thumb | Select-Object -First 1
          $machineCert = Get-ChildItem Cert:\LocalMachine\My -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $thumb | Select-Object -First 1
          $cert = if ($userCert) { $userCert } else { $machineCert }
          if (!$cert -or !$cert.HasPrivateKey) { throw 'Configured Ghosium signing certificate/private key is unavailable.' }
          $sdk = Get-Content 'engine/build/windows-toolchain.json' -Raw | ConvertFrom-Json
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10).KitsRoot10
          $signtool = Join-Path $kits "bin\$($sdk.windowsSdkVersion)\x64\signtool.exe"
          if (!(Test-Path $signtool -PathType Leaf)) { throw "signtool.exe missing: $signtool" }
          function Sign-One([string]$Path,[string]$Description) {
            $args = @('sign')
            if (!$userCert -and $machineCert) { $args += '/sm' }
            $args += @('/sha1',$thumb,'/fd','SHA256','/tr',$env:GHOSIUM_TIMESTAMP_URL,'/td','SHA256','/d',$Description,$Path)
            & $signtool @args | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Signing failed: $Path" }
            & $signtool verify /pa /all /v $Path | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Signature verification failed: $Path" }
          }
          Sign-One 'artifacts/stage/Ghosium-Browser.exe' 'Ghosium Browser'
          Sign-One 'artifacts/stage/runtime/firefox.exe' 'Ghosium Browser Engine'
          "publisher=$($cert.Subject)" | Out-File -FilePath $env:GITHUB_OUTPUT -Encoding utf8 -Append
      - name: Build and sign Setup and Portable
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $resolved = @(& ./scripts/resolve-nsis.ps1)
          $makensis = [string]($resolved | Select-Object -Last 1)
          $stage = (Resolve-Path 'artifacts/stage').Path
          $public = (Resolve-Path 'artifacts/public').Path
          $icon = (Resolve-Path 'ghosium.ico').Path
          foreach ($script in @('installer/ghosium.nsi','installer/ghosium-portable.nsi')) {
            & $makensis '/DGHOSIUM_VERSION=0.0.3' "/DGHOSIUM_STAGE=$stage" "/DGHOSIUM_ARTIFACTS=$public" "/DGHOSIUM_ICON=$icon" (Resolve-Path $script).Path
            if ($LASTEXITCODE -ne 0) { throw "NSIS build failed: $script" }
          }
          $thumb = ($env:GHOSIUM_SIGN_CERT_THUMBPRINT -replace '[^0-9A-Fa-f]', '').ToUpperInvariant()
          $sdk = Get-Content 'engine/build/windows-toolchain.json' -Raw | ConvertFrom-Json
          $kits = (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows Kits\Installed Roots' -Name KitsRoot10).KitsRoot10
          $signtool = Join-Path $kits "bin\$($sdk.windowsSdkVersion)\x64\signtool.exe"
          $userCert = Get-ChildItem Cert:\CurrentUser\My -ErrorAction SilentlyContinue | Where-Object Thumbprint -eq $thumb | Select-Object -First 1
          foreach ($path in @('artifacts/public/Ghosium-Browser-Setup.exe','artifacts/public/Ghosium-Browser-Portable.exe')) {
            $args = @('sign')
            if (!$userCert) { $args += '/sm' }
            $args += @('/sha1',$thumb,'/fd','SHA256','/tr',$env:GHOSIUM_TIMESTAMP_URL,'/td','SHA256','/d','Ghosium Browser',$path)
            & $signtool @args | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Package signing failed: $path" }
            & $signtool verify /pa /all /v $path | Out-Host
            if ($LASTEXITCODE -ne 0) { throw "Package signature verification failed: $path" }
          }
      - name: Generate signed production provenance
        shell: pwsh
        env:
          PUBLISHER: ${{ steps.sign.outputs.publisher }}
        run: |
          $ErrorActionPreference = 'Stop'
          $setup = Get-Item 'artifacts/public/Ghosium-Browser-Setup.exe'
          $portable = Get-Item 'artifacts/public/Ghosium-Browser-Portable.exe'
          $evidence = [ordered]@{
            schemaVersion = 2
            product = 'Ghosium Browser'
            platform = 'windows-x86_64'
            version = '0.0.3'
            engine = 'Tor Browser / Firefox ESR'
            torBrowserVersion = '15.0.24'
            firefoxVersion = '140.17.0esr'
            torVersion = '0.4.9.13'
            chromiumFallbackAllowed = $false
            sourceCommit = $env:GITHUB_SHA
            publisher = $env:PUBLISHER
            setupSha256 = (Get-FileHash $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            portableSha256 = (Get-FileHash $portable.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
            setupSignature = [string](Get-AuthenticodeSignature $setup.FullName).Status
            portableSignature = [string](Get-AuthenticodeSignature $portable.FullName).Status
          }
          if ($evidence.setupSignature -ne 'Valid' -or $evidence.portableSignature -ne 'Valid') { throw 'Production signatures are not valid.' }
          [IO.File]::WriteAllText('artifacts/public/GHOSIUM-TOR-BROWSER-WINDOWS.json', (($evidence | ConvertTo-Json -Depth 8) + [Environment]::NewLine), [Text.UTF8Encoding]::new($false))
          $files = @('artifacts/public/Ghosium-Browser-Setup.exe','artifacts/public/Ghosium-Browser-Portable.exe','artifacts/public/GHOSIUM-TOR-BROWSER-WINDOWS.json')
          $lines = foreach ($file in $files) { $item = Get-Item $file; "$((Get-FileHash $item.FullName -Algorithm SHA256).Hash.ToLowerInvariant())  $($item.Name)" }
          $lines | Set-Content 'artifacts/public/SHA256SUMS.txt' -Encoding ascii
      - name: Publish immutable Ghosium 0.0.3 Windows release
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $tag = 'ghosium-v0.0.3-preview.1'
          gh release view $tag --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) { throw "Immutable release already exists: $tag" }
          gh release create $tag artifacts/public/Ghosium-Browser-Setup.exe artifacts/public/Ghosium-Browser-Portable.exe artifacts/public/GHOSIUM-TOR-BROWSER-WINDOWS.json artifacts/public/SHA256SUMS.txt --target $env:GITHUB_SHA --title 'Ghosium 0.0.3' --notes 'Windows-only Ghosium release built from the pinned Tor Browser 15.0.24 / Firefox 140.17.0 ESR source baseline. Chromium fallback is disabled. Setup and Portable are Authenticode-signed and bound to this exact source commit.'
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release publication failed.' }

  verify-release:
    name: Verify immutable Windows-only release
    needs: sign-and-publish
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Verify final assets
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          release_json="$(gh api "/repos/$GITHUB_REPOSITORY/releases/tags/ghosium-v0.0.3-preview.1")"
          test "$(jq -r '.draft' <<<"$release_json")" = 'false'
          test "$(jq -r '.prerelease' <<<"$release_json")" = 'false'
          test "$(jq -r '.target_commitish' <<<"$release_json")" = "$GITHUB_SHA"
          for required in Ghosium-Browser-Setup.exe Ghosium-Browser-Portable.exe GHOSIUM-TOR-BROWSER-WINDOWS.json SHA256SUMS.txt; do
            jq -e --arg name "$required" '.assets | any(.name == $name)' <<<"$release_json" >/dev/null || { echo "Missing final asset: $required" >&2; exit 1; }
          done
          if jq -e '.assets | any(.name | test("Android|\\.apk$"; "i"))' <<<"$release_json" >/dev/null; then
            echo 'Windows-only release contains a forbidden mobile artifact.' >&2
            exit 1
          fi
