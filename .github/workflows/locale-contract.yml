name: Ghosium Locale Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'engine/branding/product.json'
      - 'engine/branding/locale-ui.json'
      - 'installer/ghosium.nsi'
      - 'compat-preview/launcher/main.cpp'
      - '.github/workflows/locale-contract.yml'
  push:
    branches: [main]
    paths:
      - 'engine/branding/product.json'
      - 'engine/branding/locale-ui.json'
      - 'installer/ghosium.nsi'
      - 'compat-preview/launcher/main.cpp'
      - '.github/workflows/locale-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  locale-contract:
    name: Verify Firefox locale and Setup integration
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Validate locale metadata
        shell: python
        run: |
          import json
          from pathlib import Path
          product = json.loads(Path('engine/branding/product.json').read_text(encoding='utf-8'))
          locale_ui = json.loads(Path('engine/branding/locale-ui.json').read_text(encoding='utf-8'))
          locales = product['locales']
          supported = locales['supported']
          if locales['default'] != 'en-US':
              raise SystemExit('English en-US must remain the primary Ghosium locale.')
          if locales['required'] != 'hr':
              raise SystemExit('Croatian hr must remain required.')
          if len(supported) < 31 or len(supported) != len(set(supported)):
              raise SystemExit('Ghosium locale list is incomplete or contains duplicates.')
          profile = locale_ui.get('strings', {}).get('profile', {})
          missing = [locale for locale in supported if not str(profile.get(locale, '')).strip()]
          if missing:
              raise SystemExit(f'Localized profile labels missing: {missing}')
          print(f'Ghosium locale metadata: OK ({len(supported)} locales).')

      - name: Verify Setup selector matches locale metadata
        shell: python
        run: |
          import json, re
          from pathlib import Path
          expected = json.loads(Path('engine/branding/product.json').read_text(encoding='utf-8'))['locales']['supported']
          text = Path('installer/ghosium.nsi').read_text(encoding='utf-8')
          languages = re.findall(r'!insertmacro MUI_LANGUAGE "([^"]+)"', text)
          mappings = dict(re.findall(r'LangString GhosiumLocale \$\{LANG_([A-Z0-9]+)\} "([^"]+)"', text))
          if len(languages) != len(expected):
              raise SystemExit('Setup language count does not match browser locale contract.')
          if set(mappings.values()) != set(expected):
              raise SystemExit('Setup locale mappings do not match Ghosium locale metadata.')
          if languages[0] != 'English' or mappings.get('CROATIAN') != 'hr':
              raise SystemExit('English default / Croatian required locale contract failed.')
          if '!insertmacro MUI_LANGDLL_DISPLAY' not in text:
              raise SystemExit('Interactive Setup language selector is missing.')

      - name: Verify Firefox locale handoff without Chromium profile state
        shell: python
        run: |
          from pathlib import Path
          launcher = Path('compat-preview/launcher/main.cpp').read_text(encoding='utf-8')
          installer = Path('installer/ghosium.nsi').read_text(encoding='utf-8')
          for token in (
              'kLanguagePrefix[] = L"--ghosium-language="',
              'ReadFirstLine(root / L"ghosium-language.txt")',
              'arguments.emplace_back(L"-UILocale")',
              'kProfileDirectory[] = L"Ghosium"',
              'L"Profile"',
          ):
              if token not in launcher:
                  raise SystemExit(f'Firefox locale/profile launcher invariant missing: {token}')
          for token in (
              'FileOpen $0 "$INSTDIR\\ghosium-language.txt" w',
              'FileWrite $0 "$(GhosiumLocale)$\\r$\\n"',
          ):
              if token not in installer:
                  raise SystemExit(f'Setup locale handoff invariant missing: {token}')
          for forbidden in ('Local State', '\\User Data', 'app_locale'):
              if forbidden in installer:
                  raise SystemExit(f'Chromium locale/profile residue returned to installer: {forbidden}')
          print('Firefox -UILocale handoff: OK; Chromium Local State is absent.')
