name: Ghosium Tor Browser Engine Audit

on:
  pull_request:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'engine/**'
      - 'scripts/bootstrap-tor-browser-source.ps1'
      - 'scripts/verify-tor-browser-upstream.ps1'
      - '.github/workflows/engine-source-audit.yml'
      - '.github/workflows/tor-browser-windows-build.yml'
  push:
    branches:
      - main
    paths:
      - 'VERSION'
      - 'engine/**'
      - 'scripts/bootstrap-tor-browser-source.ps1'
      - 'scripts/verify-tor-browser-upstream.ps1'
      - '.github/workflows/engine-source-audit.yml'
      - '.github/workflows/tor-browser-windows-build.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  source-contract:
    name: Verify Tor Browser / Firefox ESR Windows source contract
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse Windows engine tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/verify-tor-browser-upstream.ps1',
            'scripts/bootstrap-tor-browser-source.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error $_.Message }
              throw "PowerShell parser errors found in $path"
            }
          }

      - name: Verify pinned Tor Browser upstream contract
        shell: pwsh
        run: ./scripts/verify-tor-browser-upstream.ps1

      - name: Verify Windows-only engine migration invariants
        shell: python
        run: |
          import json
          from pathlib import Path

          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if version != '0.0.9':
              raise SystemExit(f'Expected Windows engine baseline 0.0.9, got {version!r}')

          contract = json.loads(Path('engine/tor-browser/windows-x64.json').read_text(encoding='utf-8'))
          expected = {
              'torBrowserVersion': '15.0.24',
              'firefoxVersion': '140.17.0esr',
              'torVersion': '0.4.9.13',
              'targetPlatform': 'windows-x86_64',
              'chromiumFallbackAllowed': False,
          }
          for key, value in expected.items():
              if contract.get(key) != value:
                  raise SystemExit(f'Tor Browser contract mismatch for {key}: {contract.get(key)!r}')

          if not contract.get('sourceUrl', '').startswith(
              'https://archive.torproject.org/tor-package-archive/torbrowser/15.0.24/'
          ):
              raise SystemExit('Tor Browser source origin is not the official Tor Project archive.')

          bootstrap = Path('scripts/bootstrap-tor-browser-source.ps1').read_text(encoding='utf-8')
          for token in (
              'Get-FileHash $Path -Algorithm SHA256',
              'Downloaded Tor Browser source failed the pinned SHA-256 contract.',
              "foreach ($required in @('browser','toolkit','dom','netwerk','security'))",
              'Pinned Tor Browser source is missing the Mozilla mach build entrypoint.',
              'chromiumFallbackAllowed = $false',
          ):
              if token not in bootstrap:
                  raise SystemExit(f'Tor Browser bootstrap contract missing: {token}')

          active_docs = (
              Path('README.md').read_text(encoding='utf-8'),
              Path('ARCHITECTURE.md').read_text(encoding='utf-8'),
              Path('BUILDING.md').read_text(encoding='utf-8'),
              Path('engine/README.md').read_text(encoding='utf-8'),
          )
          joined = '\n'.join(active_docs)
          if 'Chromium fallback is forbidden' not in joined and 'Chromium fallback is explicitly forbidden' not in joined:
              raise SystemExit('Active engine documentation does not explicitly forbid Chromium fallback.')

          print('Ghosium Tor Browser / Firefox ESR Windows engine contract: OK')

      - name: Verify no active Chromium production builder reference
        shell: python
        run: |
          from pathlib import Path

          production = Path('.github/workflows/ghosium-0.0.9-production-release.yml').read_text(encoding='utf-8')
          if 'full-source-windows-build.yml' in production:
              raise SystemExit(
                  '0.0.9 production still dispatches the Chromium full-source workflow. '
                  'Switch production to tor-browser-windows-build.yml before publication.'
              )
          if 'tor-browser-windows-build.yml' not in production:
              raise SystemExit('0.0.9 production does not reference the Tor Browser Windows builder.')
