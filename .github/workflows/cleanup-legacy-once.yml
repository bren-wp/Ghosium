name: One-time legacy branch cleanup
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/cleanup-legacy-once.yml'
permissions:
  contents: write
jobs:
  remove-old-branches:
    runs-on: ubuntu-latest
    steps:
      - name: Remove legacy branches, keep main
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Cleaning legacy branches in $GITHUB_REPOSITORY"
          gh api --paginate "repos/$GITHUB_REPOSITORY/branches?per_page=100" --jq '.[].name' > branches.txt
          count=0
          while IFS= read -r name; do
            if [ "$name" = "main" ]; then continue; fi
            echo "Deleting branch: $name"
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$name"
            count=$((count + 1))
          done < branches.txt
          echo "Removed $count legacy branches"
