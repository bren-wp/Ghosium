name: Ghosium Release Marker Promotion Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.release/*.request'
      - '.github/workflows/release-marker-promotion-contract.yml'
      - '.github/workflows/version-contract.yml'
      - '.github/workflows/tor-browser-windows-build.yml'

permissions:
  actions: read
  contents: read

jobs:
  release-marker-promotion:
    name: Verify release-marker-only promotion and Tor Browser candidate evidence
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify release marker promotion scope
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "origin/${BASE_REF}...HEAD" | sed '/^$/d')
          markers=()
          for path in "${changed[@]}"; do
            [[ "$path" == .release/*.request ]] && markers+=("$path")
          done

          version="$(tr -d '\r\n ' < VERSION)"
          base_version="$(git show "origin/${BASE_REF}:VERSION" | tr -d '\r\n ')"
          [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]
          [[ "$base_version" =~ ^0\.[0-9]+\.[0-9]+$ ]]

          if [[ "$version" != "$base_version" ]]; then
            for marker in "${markers[@]}"; do
              status="$(git diff --name-status "origin/${BASE_REF}...HEAD" -- "$marker" | awk 'NR == 1 { print $1 }')"
              [[ "$status" == "D" ]] || { echo 'Version-advancing PRs may only delete stale release markers.' >&2; exit 1; }
            done
            echo 'mode=self-test' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#markers[@]} == 0 )); then
            echo 'mode=self-test' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#markers[@]} != 1 || ${#changed[@]} != 1 )); then
            echo 'A release-marker-only PR must change exactly one marker and no other files.' >&2
            exit 1
          fi

          tag="ghosium-v${version}-preview.1"
          marker=".release/${tag}.request"
          [[ "${markers[0]}" == "$marker" ]]
          [[ "$HEAD_REF" == "ghosium/release/${version}" ]]
          [[ "$(tr -d '\r\n ' < "$marker")" == "$tag" ]]

          echo 'mode=marker' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo 'Validated release-marker-only PR.'

      - name: Self-test Tor Browser promotion invariants
        shell: python
        run: |
          from pathlib import Path

          promotion = Path('.github/workflows/release-marker-promotion-contract.yml').read_text(encoding='utf-8')
          version_contract = Path('.github/workflows/version-contract.yml').read_text(encoding='utf-8')
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')

          for required in (
              'actions: read',
              'release-marker-only',
              'tor-browser-windows-build.yml',
              'github.event.pull_request.head.sha',
              'Ghosium-Browser-Setup.exe',
              'Ghosium-Browser-Portable.exe',
              'GHOSIUM-TOR-BROWSER-WINDOWS.json',
              'SHA256SUMS.txt',
              'releaseReady',
              'Candidate workflow was not started for exact release SHA',
          ):
              if required not in promotion:
                  raise SystemExit(f'Release promotion invariant missing: {required}')

          for required in (
              'HEAD_REF:',
              'ghosium/release/{version}',
              'release-marker-only PR',
              'candidate evidence is enforced by the release marker promotion contract',
          ):
              if required not in version_contract:
                  raise SystemExit(f'Version contract release-marker invariant missing: {required}')

          for required in (
              'workflow_dispatch:',
              'verify-tor-browser-upstream.ps1',
              'bootstrap-tor-browser-source.ps1',
              'Ghosium-Browser-Setup.exe',
              'Ghosium-Browser-Portable.exe',
              'releaseReady = $true',
          ):
              if required not in builder:
                  raise SystemExit(f'Tor Browser Windows builder invariant missing: {required}')

      - name: Require successful exact Tor Browser Windows candidate
        if: steps.scope.outputs.mode == 'marker'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GHOSIUM_VERSION: ${{ steps.scope.outputs.version }}
          GHOSIUM_TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$GHOSIUM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release $GHOSIUM_TAG already exists." >&2
            exit 1
          fi

          # Firefox/Tor source builds can legitimately run for hours. Track only the
          # newest exact-SHA candidate so a superseded failed attempt cannot poison a rerun.
          deadline=$((SECONDS + 19800))
          run_id=""
          last_reported=""
          while (( SECONDS < deadline )); do
            runs_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/workflows/tor-browser-windows-build.yml/runs" -f branch="$HEAD_REF" -f per_page='100')"
            selected="$(jq -c --arg sha "$CANDIDATE_SHA" '[.workflow_runs[] | select(.head_sha == $sha) | select(.event == "push" or .event == "workflow_dispatch")] | sort_by(.created_at) | last // empty' <<< "$runs_json")"
            seen_run="$(jq -r '.id // empty' <<< "$selected")"
            if [[ -z "$seen_run" ]]; then
              echo "Candidate workflow was not started for exact release SHA $CANDIDATE_SHA." >&2
              echo "Expected a push-triggered run on $HEAD_REF." >&2
              exit 1
            fi

            status="$(jq -r '.status // empty' <<< "$selected")"
            conclusion="$(jq -r '.conclusion // empty' <<< "$selected")"
            if [[ "$status" == "completed" ]]; then
              if [[ "$conclusion" == "success" ]]; then
                run_id="$seen_run"
                break
              fi
              echo "Newest exact Tor Browser Windows candidate $seen_run ended unsuccessfully: $conclusion" >&2
              exit 1
            fi

            report_key="$seen_run:$status"
            if [[ "$report_key" != "$last_reported" ]]; then
              echo "Candidate run $seen_run is $status for $CANDIDATE_SHA."
              last_reported="$report_key"
            fi
            sleep 120
          done

          [[ -n "$run_id" ]] || { echo 'Timed out after 5.5 hours waiting for the newest exact Tor Browser Windows candidate.' >&2; exit 1; }
          artifact_name="ghosium-tor-browser-windows-x64-${GHOSIUM_VERSION}"
          artifacts_json="$(gh api --method GET "/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}/artifacts" -f per_page='100')"
          artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name) | select(.expired == false)] | last | .id // empty' <<< "$artifacts_json")"
          [[ -n "$artifact_id" ]] || { echo "Candidate artifact $artifact_name is missing." >&2; exit 1; }
          echo "artifact_id=$artifact_id" >> "$GITHUB_ENV"

      - name: Download and verify release-ready Tor Browser candidate
        if: steps.scope.outputs.mode == 'marker'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSIUM_VERSION: ${{ steps.scope.outputs.version }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/ghosium-candidate.zip"
          evidence_dir="$RUNNER_TEMP/ghosium-candidate"
          mkdir -p "$evidence_dir"
          gh api -H 'Accept: application/vnd.github+json' "/repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}/zip" > "$zip_path"
          unzip -q "$zip_path" -d "$evidence_dir"

          for file in \
            Ghosium-Browser-Setup.exe \
            Ghosium-Browser-Portable.exe \
            GHOSIUM-TOR-BROWSER-WINDOWS.json \
            SHA256SUMS.txt; do
            test -s "$evidence_dir/$file" || { echo "Candidate evidence is missing: $file" >&2; exit 1; }
          done

          pushd "$evidence_dir" >/dev/null
          sha256sum -c SHA256SUMS.txt
          popd >/dev/null

          EVIDENCE_DIR="$evidence_dir" GHOSIUM_VERSION="$GHOSIUM_VERSION" python3 - <<'PY'
          import json, os
          from pathlib import Path

          root = Path(os.environ['EVIDENCE_DIR'])
          version = os.environ['GHOSIUM_VERSION']
          evidence = json.loads((root / 'GHOSIUM-TOR-BROWSER-WINDOWS.json').read_text(encoding='utf-8-sig'))

          if evidence.get('product') != 'Ghosium Browser':
              raise SystemExit('Candidate product identity mismatch.')
          if evidence.get('version') != version:
              raise SystemExit('Candidate version mismatch.')
          if evidence.get('engine') != 'Tor Browser / Firefox ESR':
              raise SystemExit('Candidate engine identity mismatch.')
          if evidence.get('chromiumFallbackAllowed') is not False:
              raise SystemExit('Candidate re-enabled retired engine fallback.')
          if evidence.get('releaseReady') is not True:
              raise SystemExit('Candidate is intentionally not release-ready yet.')

          print('Exact release-ready Tor Browser Windows candidate: OK')
          PY
