name: Ghosium Release Marker Promotion Contract

on:
  pull_request:
    branches: [main]
    paths:
      - '.release/*.request'
      - '.github/workflows/release-marker-promotion-contract.yml'
      - '.github/workflows/version-contract.yml'
      - '.github/workflows/tor-browser-windows-build.yml'

permissions:
  actions: read
  contents: read

jobs:
  release-marker-promotion:
    name: Verify release-marker-only promotion and Tor Browser Windows candidate
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Classify release marker promotion scope
        id: scope
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
          HEAD_REF: ${{ github.head_ref }}
        run: |
          set -euo pipefail
          mapfile -t changed < <(git diff --name-only "origin/$BASE_REF...HEAD" | sed '/^$/d')
          markers=()
          for path in "${changed[@]}"; do
            [[ "$path" == .release/*.request ]] && markers+=("$path")
          done

          version="$(tr -d '\r\n ' < VERSION)"
          base_version="$(git show "origin/$BASE_REF:VERSION" | tr -d '\r\n ')"
          if [[ "$version" != "$base_version" ]]; then
            for marker in "${markers[@]}"; do
              status="$(git diff --name-status "origin/$BASE_REF...HEAD" -- "$marker" | awk 'NR == 1 { print $1 }')"
              [[ "$status" == "D" ]] || { echo 'Version-advancing PRs may only delete stale release markers.' >&2; exit 1; }
            done
            echo 'mode=self-test' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#markers[@]} == 0 )); then
            echo 'mode=self-test' >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if (( ${#markers[@]} != 1 || ${#changed[@]} != 1 )); then
            echo 'A release marker promotion PR must change exactly one release marker and no other files.' >&2
            exit 1
          fi

          tag="ghosium-v$version"
          expected_marker=".release/$tag.request"
          expected_head="ghosium/release/$version"
          [[ "${markers[0]}" == "$expected_marker" ]] || { echo 'Release marker path/version mismatch.' >&2; exit 1; }
          [[ "$HEAD_REF" == "$expected_head" ]] || { echo "Release marker promotion must come from $expected_head." >&2; exit 1; }
          [[ "$(tr -d '\r\n ' < "$expected_marker")" == "$tag" ]] || { echo 'Release marker content mismatch.' >&2; exit 1; }

          echo 'mode=marker' >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

      - name: Self-test Tor Browser Windows promotion invariants
        shell: python
        run: |
          from pathlib import Path
          promotion = Path('.github/workflows/release-marker-promotion-contract.yml').read_text(encoding='utf-8')
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')
          for required in (
              'tor-browser-windows-build.yml',
              'ghosium-tor-browser-windows-x64-',
              'GHOSIUM-TOR-BROWSER-WINDOWS.json',
              'Ghosium-Browser-Setup.exe',
              'Ghosium-Browser-Portable.exe',
              'chromiumFallbackAllowed',
              'SHA256SUMS.txt',
          ):
              if required not in promotion:
                  raise SystemExit(f'Release promotion invariant missing: {required}')
          for required in ('Tor Browser / Firefox ESR', '15.0.24', '140.17.0esr', 'firefox.exe'):
              if required not in builder:
                  raise SystemExit(f'Tor Browser Windows builder invariant missing: {required}')

      - name: Require successful exact Tor Browser Windows candidate
        if: steps.scope.outputs.mode == 'marker'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
          HEAD_REF: ${{ github.head_ref }}
          GHOSIUM_VERSION: ${{ steps.scope.outputs.version }}
          GHOSIUM_TAG: ${{ steps.scope.outputs.tag }}
        run: |
          set -euo pipefail
          if gh release view "$GHOSIUM_TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "Immutable release $GHOSIUM_TAG already exists." >&2
            exit 1
          fi

          deadline=$((SECONDS + 19800))
          run_id=""
          while (( SECONDS < deadline )); do
            runs_json="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/workflows/tor-browser-windows-build.yml/runs" -f branch="$HEAD_REF" -f event='workflow_dispatch' -f per_page='100')"
            exact_runs="$(jq -c --arg sha "$CANDIDATE_SHA" '[.workflow_runs[] | select(.head_sha == $sha and .event == "workflow_dispatch")] | sort_by(.created_at)' <<<"$runs_json")"
            run_id="$(jq -r '[.[] | select(.status == "completed" and .conclusion == "success")] | last | .id // empty' <<<"$exact_runs")"
            [[ -n "$run_id" ]] && break

            terminal="$(jq -r '[.[] | select(.status == "completed" and .conclusion != "success")] | if length > 0 then (last | [.id, .conclusion] | @tsv) else empty end' <<<"$exact_runs")"
            if [[ -n "$terminal" ]]; then
              echo "Exact Tor Browser Windows candidate ended unsuccessfully: $terminal" >&2
              exit 1
            fi
            echo "Waiting for exact Tor Browser Windows candidate for $CANDIDATE_SHA."
            sleep 30
          done
          [[ -n "$run_id" ]] || { echo 'Timed out waiting for exact Tor Browser Windows candidate.' >&2; exit 1; }

          artifact_name="ghosium-tor-browser-windows-x64-$GHOSIUM_VERSION"
          artifacts_json="$(gh api --method GET "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/artifacts" -f per_page='100')"
          artifact_id="$(jq -r --arg name "$artifact_name" '[.artifacts[] | select(.name == $name and .expired == false)] | last | .id // empty' <<<"$artifacts_json")"
          [[ -n "$artifact_id" ]] || { echo "Candidate artifact missing: $artifact_name" >&2; exit 1; }
          echo "artifact_id=$artifact_id" >> "$GITHUB_ENV"

      - name: Download and verify candidate evidence
        if: steps.scope.outputs.mode == 'marker'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          GHOSIUM_VERSION: ${{ steps.scope.outputs.version }}
          CANDIDATE_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          set -euo pipefail
          zip_path="$RUNNER_TEMP/ghosium-candidate.zip"
          evidence_dir="$RUNNER_TEMP/ghosium-candidate"
          mkdir -p "$evidence_dir"
          gh api -H 'Accept: application/vnd.github+json' "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$zip_path"
          unzip -q "$zip_path" -d "$evidence_dir"

          for file in Ghosium-Browser-Setup.exe Ghosium-Browser-Portable.exe GHOSIUM-TOR-BROWSER-WINDOWS.json SHA256SUMS.txt; do
            test -s "$evidence_dir/$file" || { echo "Candidate evidence missing: $file" >&2; exit 1; }
          done
          pushd "$evidence_dir" >/dev/null
          sha256sum -c SHA256SUMS.txt
          popd >/dev/null

          EVIDENCE_DIR="$evidence_dir" python3 - <<'PY'
          import json, os
          from pathlib import Path
          root = Path(os.environ['EVIDENCE_DIR'])
          e = json.loads((root / 'GHOSIUM-TOR-BROWSER-WINDOWS.json').read_text(encoding='utf-8-sig'))
          if e.get('product') != 'Ghosium Browser':
              raise SystemExit('Unexpected product identity.')
          if e.get('version') != os.environ['GHOSIUM_VERSION']:
              raise SystemExit('Candidate version mismatch.')
          if e.get('sourceCommit') != os.environ['CANDIDATE_SHA']:
              raise SystemExit('Candidate source commit mismatch.')
          if e.get('engine') != 'Tor Browser / Firefox ESR':
              raise SystemExit('Candidate engine identity mismatch.')
          if e.get('torBrowserVersion') != '15.0.24' or e.get('firefoxVersion') != '140.17.0esr':
              raise SystemExit('Candidate Tor Browser/Firefox ESR pin mismatch.')
          if e.get('chromiumFallbackAllowed') is not False:
              raise SystemExit('Chromium fallback must remain disabled.')
          print('Exact Tor Browser Windows candidate evidence: OK')
          PY
