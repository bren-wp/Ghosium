name: Ghosium Release Safety Supervisor

on:
  push:
    branches:
      - main

permissions:
  actions: write
  contents: read

concurrency:
  group: ghosium-release-safety-supervisor
  cancel-in-progress: true

jobs:
  cancel-unpromoted-production-builds:
    name: Cancel unpromoted main Tor Browser Windows runs
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Cancel main Tor Browser Windows runs whose commit lacks its exact marker
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail

          runs_json="$(gh api "/repos/$GITHUB_REPOSITORY/actions/workflows/tor-browser-windows-build.yml/runs?branch=main&per_page=100")"
          jq -r '.workflow_runs[]
            | select(.status == "queued" or .status == "in_progress" or .status == "waiting" or .status == "pending")
            | [.id, .head_sha] | @tsv' <<<"$runs_json" |
          while IFS=$'\t' read -r run_id sha; do
            [ -n "$run_id" ] && [ -n "$sha" ] || continue

            version_json="$(gh api "/repos/$GITHUB_REPOSITORY/contents/VERSION?ref=$sha" 2>/dev/null || true)"
            version="$(jq -r '.content // empty' <<<"$version_json" | tr -d '\n' | base64 --decode 2>/dev/null | tr -d '\r\n ' || true)"
            if ! [[ "$version" =~ ^0\.[0-9]+\.[0-9]+$ ]]; then
              echo "Cancelling Tor Browser Windows run $run_id: invalid VERSION at $sha"
              gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
              continue
            fi

            tag="ghosium-v${version}-preview.1"
            marker_path=".release/$tag.request"
            marker_json="$(gh api "/repos/$GITHUB_REPOSITORY/contents/$marker_path?ref=$sha" 2>/dev/null || true)"
            marker="$(jq -r '.content // empty' <<<"$marker_json" | tr -d '\n' | base64 --decode 2>/dev/null | tr -d '\r\n ' || true)"

            if [ "$marker" != "$tag" ]; then
              echo "Cancelling unpromoted Tor Browser Windows run $run_id at $sha (expected $marker_path = $tag)."
              gh api --method POST "/repos/$GITHUB_REPOSITORY/actions/runs/$run_id/cancel" >/dev/null || true
            else
              echo "Keeping promoted Tor Browser Windows run $run_id at $sha."
            fi
          done
