name: Ghosium Brand Surface Contract

on:
  pull_request:
    branches:
      - main
    paths:
      - 'README.md'
      - 'extension/**'
      - 'store-web/**'
      - 'updates-web/**'
      - 'installer/**'
      - 'engine/**'
      - '.github/workflows/brand-surface-contract.yml'
  push:
    branches:
      - main
    paths:
      - 'README.md'
      - 'extension/**'
      - 'store-web/**'
      - 'updates-web/**'
      - 'installer/**'
      - 'engine/**'
      - '.github/workflows/brand-surface-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  brand-surface:
    name: Verify Ghosium-only Windows public surfaces
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Reject retired browser branding on Ghosium-owned distributable surfaces
        shell: python
        run: |
          from pathlib import Path
          import re

          roots = (Path('extension'), Path('store-web'), Path('updates-web'), Path('installer'))
          suffixes = {'.md','.html','.php','.json','.css','.js','.ts','.cpp','.h','.rc','.nsi','.txt','.svg'}
          legacy = re.compile(
              r'chromium|google\s+chrome|\bchrome\b|chrome://|chrome-untrusted://|'
              r'support\.google|chrome\.google|google\.com/chrome',
              re.I,
          )
          allowed_api = re.compile(r'\bchrome\.(?:storage|runtime|tabs)\b')
          failures = []

          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file() or path.suffix.lower() not in suffixes:
                      continue
                  text = path.read_text(encoding='utf-8', errors='replace')
                  for number, line in enumerate(text.splitlines(), 1):
                      check = allowed_api.sub('webextension-api', line) if path.suffix.lower() in {'.js','.ts'} else line
                      if legacy.search(check):
                          failures.append(f'{path}:{number}: {line.strip()}')

          readme = Path('README.md').read_text(encoding='utf-8')
          readme_legacy = re.compile(
              r'google\s+chrome|\bchrome\b|chrome://|chrome-untrusted://|'
              r'support\.google|chrome\.google|google\.com/chrome',
              re.I,
          )
          legal_heading = '## License and third-party rights'
          if legal_heading not in readme:
              failures.append('README.md: missing explicit legal-attribution section')
          else:
              public_readme, legal_readme = readme.split(legal_heading, 1)
              for number, line in enumerate(public_readme.splitlines(), 1):
                  if readme_legacy.search(line):
                      failures.append(f'README.md:{number}: {line.strip()}')
              for required in ('Tor Browser', 'Firefox ESR', 'Tor', 'third-party'):
                  if required.lower() not in legal_readme.lower():
                      failures.append(f'README.md: legal attribution missing {required}')

          if failures:
              raise SystemExit(
                  'Retired product branding leaked into a Ghosium-owned public/distributable surface:\n'
                  + '\n'.join(failures)
              )
          print('Ghosium Windows public/distributable branding contract: OK')

      - name: Verify first-party destinations and DuckDuckGo search boundary
        shell: python
        run: |
          from pathlib import Path
          import re

          allowed_ghosium_hosts = {'ghosium.com','store.ghosium.com','updates.ghosium.com'}
          url_re = re.compile(r"https://([a-z0-9.-]+)(?:/[^\s\"'<>)]*)?", re.I)

          for path in (Path('store-web/index.php'), Path('updates-web/index.php')):
              text = path.read_text(encoding='utf-8')
              for host in url_re.findall(text):
                  if host.lower() not in allowed_ghosium_hosts:
                      raise SystemExit(f'Non-Ghosium product URL in {path}: https://{host}')

          newtab = Path('extension/newtab.html').read_text(encoding='utf-8')
          if 'action="https://duckduckgo.com/"' not in newtab or 'name="q"' not in newtab:
              raise SystemExit('New Tab must submit q directly to DuckDuckGo.')
          for forbidden in ('www.google.com/search','search.ghosium.com','Ghosium Search','Search with Ghosium'):
              if forbidden in newtab:
                  raise SystemExit(f'Forbidden/retired New Tab search destination remains: {forbidden}')

          hosts = {host.lower() for host in url_re.findall(newtab)}
          unexpected = sorted(hosts - (allowed_ghosium_hosts | {'duckduckgo.com'}))
          if unexpected:
              raise SystemExit('Unexpected New Tab external destination(s): ' + ', '.join(unexpected))
          print('Ghosium destinations + DuckDuckGo boundary: OK')

      - name: Verify Tor Browser Windows engine boundary
        shell: python
        run: |
          import json
          from pathlib import Path

          contract = json.loads(Path('engine/tor-browser/windows-x64.json').read_text(encoding='utf-8'))
          if contract.get('targetPlatform') != 'windows-x86_64':
              raise SystemExit('Engine target must remain Windows x86_64.')
          if contract.get('chromiumFallbackAllowed') is not False:
              raise SystemExit('Retired engine fallback must remain forbidden.')
          build = contract.get('buildSystem', {})
          if build.get('target') != 'torbrowser-release-windows-x86_64':
              raise SystemExit('Tor Browser build target mismatch.')
          if build.get('commit') != '137f3dcdb78a58f157c1f7e991463c600f630728':
              raise SystemExit('Tor Browser build-system commit changed without review.')
          print('Tor Browser / Firefox ESR Windows source boundary: OK')

      - name: Verify Ghosium release executable identity
        shell: python
        run: |
          from pathlib import Path
          launcher = Path('compat-preview/launcher/main.cpp').read_text(encoding='utf-8')
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')
          for required in ('Ghosium-Browser.exe', 'firefox.exe', 'L"-profile"'):
              if required not in launcher and required not in builder:
                  raise SystemExit(f'Windows release identity invariant missing: {required}')
          if 'Ghosium-Browser-Setup.exe' not in builder or 'Ghosium-Browser-Portable.exe' not in builder:
              raise SystemExit('Tor Firefox builder must publish Setup and Portable Ghosium artifacts.')
          print('Ghosium public executable and package identity: OK')
