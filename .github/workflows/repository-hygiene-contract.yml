name: Ghosium Repository Hygiene Contract

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  repository-hygiene:
    name: Verify active fail-closed Windows-only repository state
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 0

      - name: Verify Windows-only product boundary
        shell: python
        run: |
          from pathlib import Path
          retired = (
              Path('android'),
              Path('search-provider'),
              Path('search-web'),
              Path('.github/workflows/full-source-windows-build.yml'),
              Path('.github/workflows/source-builder-contract.yml'),
              Path('.github/workflows/canonical-release-contract.yml'),
              Path('.github/workflows/native-privacy-contract.yml'),
              Path('.github/workflows/source-patch-contract.yml'),
              Path('DEPOT_TOOLS_REVISION'),
              Path('scripts/benchmark-browser-comparison-windows.ps1'),
              Path('scripts/benchmark-ghosium-windows.ps1'),
          )
          found = [str(path) for path in retired if path.exists()]
          if found:
              raise SystemExit('Retired product/build paths returned:\n' + '\n'.join(found))

      - name: Verify retired browser engines cannot return
        shell: python
        run: |
          from pathlib import Path
          roots = (Path('engine'), Path('scripts'), Path('windows'), Path('.github/workflows'))
          text_suffixes = {'.ps1', '.py', '.yml', '.yaml', '.json', '.toml', '.ini', '.cfg', '.md', '.txt', '.cs', '.cpp', '.cc', '.c', '.h', '.hpp', '.js', '.ts'}
          forbidden_path_tokens = ('chromium', 'chrome', 'webview2', 'cef', 'electron')
          forbidden_runtime_tokens = ('chrome.exe', 'chromium.exe', 'msedgewebview2.exe', 'libcef.dll', 'electron.exe', 'depot_tools', 'autoninja')
          negative_evidence_files = {
              Path('.github/workflows/repository-hygiene-contract.yml'),
              Path('.github/workflows/tor-browser-windows-build.yml'),
              Path('.github/workflows/version-contract.yml'),
              Path('.github/workflows/release-marker-promotion-contract.yml'),
          }
          violations = []
          for root in roots:
              if not root.exists():
                  continue
              for path in root.rglob('*'):
                  if not path.is_file():
                      continue
                  lower_path = path.as_posix().lower()
                  if any(token in lower_path for token in forbidden_path_tokens):
                      violations.append(f'retired engine/tool path: {path}')
                  if path.suffix.lower() not in text_suffixes:
                      continue
                  try:
                      text = path.read_text(encoding='utf-8').lower()
                  except UnicodeDecodeError:
                      continue
                  for token in forbidden_runtime_tokens:
                      if token in text:
                          violations.append(f'retired runtime/tool token {token!r}: {path}')
                  if path not in negative_evidence_files:
                      for token in ('chromiumfallbackallowed', 'chromium fallback', 'chrome fallback'):
                          if token in text:
                              violations.append(f'retired fallback token {token!r}: {path}')
          if violations:
              raise SystemExit('Retired non-Firefox engine residue detected:\\n' + '\\n'.join(sorted(set(violations))))
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')
          required = ('Tor Browser', 'Firefox', 'firefox.exe', './mach build', './mach package', 'chromiumFallbackAllowed = $false')
          missing = [token for token in required if token not in builder]
          if missing:
              raise SystemExit('Tor Browser / Firefox-only builder contract is incomplete: ' + ', '.join(missing))

      - name: Verify fail-closed checked-in update baseline
        shell: python
        run: |
          import json, re
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'0\.\d+\.\d+', version):
              raise SystemExit(f'Invalid Ghosium VERSION: {version!r}')
          manifest = json.loads(Path('updates-web/windows/stable.json').read_text(encoding='utf-8'))
          expected = {
              'schema': 1, 'product': 'Ghosium Browser', 'platform': 'windows',
              'channel': 'stable', 'enabled': False, 'version': version,
              'url': 'https://updates.ghosium.com/windows/Ghosium-Browser-Setup.exe',
              'sha256': '', 'size': 0,
              'release_notes': f'https://ghosium.com/release-notes/{version}',
          }
          if manifest != expected:
              raise SystemExit(f'Checked-in update baseline is not exact/fail-closed: {manifest}')

      - name: Verify active-version documentation
        shell: python
        run: |
          import re
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          docs = (Path('README.md'), Path('BUILDING.md'), Path('CHANGELOG.md'), Path('docs/RELEASE.md'), Path('engine/README.md'))
          for path in docs:
              text = path.read_text(encoding='utf-8')
              if version not in text:
                  raise SystemExit(f'Active Ghosium VERSION missing from {path}: {version}')
          if not Path('CHANGELOG.md').read_text(encoding='utf-8').startswith(f'# Changelog\n\n## {version} '):
              raise SystemExit('CHANGELOG must contain the active baseline entry first.')

      - name: Verify Tor Browser Windows release workflow hygiene
        shell: python
        run: |
          from pathlib import Path
          dispatcher = Path('.github/workflows/release-request-dispatch.yml').read_text(encoding='utf-8')
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')
          production = Path('.github/workflows/ghosium-0.0.3-production-release.yml').read_text(encoding='utf-8')
          supervisor = Path('.github/workflows/release-safety-supervisor.yml').read_text(encoding='utf-8')
          for required in ("'ghosium/release/**'", "'.release/*.request'", 'tor-browser-windows-build.yml'):
              if required not in dispatcher:
                  raise SystemExit(f'Candidate dispatcher invariant missing: {required}')
          for required in ('./scripts/bootstrap-tor-browser-source.ps1','./scripts/stage-tor-runtime.ps1','./mach build','./mach package','firefox.exe','Ghosium-Browser-Setup.exe','Ghosium-Browser-Portable.exe','GHOSIUM-TOR-BROWSER-WINDOWS.json','chromiumFallbackAllowed = $false'):
              if required not in builder:
                  raise SystemExit(f'Tor Browser builder invariant missing: {required}')
          for required in ('GHOSIUM_SIGN_CERT_THUMBPRINT','GHOSIUM_TIMESTAMP_URL','signtool.exe','gh release create','Ghosium-Browser-Setup.exe','Ghosium-Browser-Portable.exe'):
              if required not in production:
                  raise SystemExit(f'Production release invariant missing: {required}')
          for required in ('actions: write','tor-browser-windows-build.yml','/cancel','ghosium-v'):
              if required not in supervisor:
                  raise SystemExit(f'Release-safety supervisor invariant missing: {required}')

      - name: Verify repository formatting
        shell: bash
        run: git diff --check
