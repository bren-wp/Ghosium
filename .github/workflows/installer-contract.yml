name: Ghosium Windows Installer Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'compat-preview/launcher/**'
      - 'scripts/resolve-nsis.ps1'
      - 'scripts/smoke-test-installer-contract-fixture.ps1'
      - '.github/workflows/tor-browser-windows-build.yml'
      - '.github/workflows/ghosium-0.0.9-production-release.yml'
      - '.github/workflows/installer-contract.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'compat-preview/launcher/**'
      - 'scripts/resolve-nsis.ps1'
      - 'scripts/smoke-test-installer-contract-fixture.ps1'
      - '.github/workflows/tor-browser-windows-build.yml'
      - '.github/workflows/ghosium-0.0.9-production-release.yml'
      - '.github/workflows/installer-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  contract:
    name: Verify Windows Setup Portable and maintenance architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Require immutable GitHub Actions references
        shell: python
        run: |
          import re
          from pathlib import Path
          action = re.compile(r'^\s*uses:\s*([^\s#]+)', re.MULTILINE)
          immutable = re.compile(r'^[A-Za-z0-9_.-]+/[A-Za-z0-9_.-]+@[0-9a-f]{40}$')
          docker = re.compile(r'^docker://[^@\s]+@sha256:[0-9a-f]{64}$')
          for path in sorted(Path('.github/workflows').glob('*.y*ml')):
              for match in action.finditer(path.read_text(encoding='utf-8')):
                  ref = match.group(1)
                  if ref.startswith('./') or immutable.fullmatch(ref) or docker.fullmatch(ref):
                      continue
                  raise SystemExit(f'Mutable GitHub Action reference in {path}: {ref}')

      - name: Verify pinned NSIS supply chain
        shell: python
        run: |
          from pathlib import Path
          resolver = Path('scripts/resolve-nsis.ps1').read_text(encoding='utf-8')
          for required in (
              'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip',
              '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f',
              'Get-FileHash $archive -Algorithm SHA256',
              "'v3.12'",
          ):
              if required not in resolver:
                  raise SystemExit(f'Pinned NSIS contract missing: {required}')

      - name: Verify same-Setup maintenance contract
        shell: python
        run: |
          from pathlib import Path
          text = Path('installer/ghosium.nsi').read_text(encoding='utf-8')
          for required in (
              '!define INSTALLED_SETUP "Installer\\Ghosium-Browser-Setup.exe"',
              '${GetOptions} $R0 "/UPDATE" $R1',
              '${GetOptions} $R0 "/UNINSTALL" $R1',
              '${GetOptions} $R0 "/CLEANUPDATE=" $R1',
              'StrCmp $R6 "Ghosium-Browser-Setup.exe" 0 update_cleanup_invalid',
              'Delete /REBOOTOK "$R5"',
              '/IM "Ghosium-Browser.exe" /T /F',
          ):
              if required not in text:
                  raise SystemExit(f'Same-Setup maintenance contract missing: {required}')
          for forbidden in ('WriteUninstaller', 'Ghosium-Updater.exe', 'Ghosium-Update.exe'):
              if forbidden.lower() in text.lower():
                  raise SystemExit(f'Forbidden standalone maintenance construct: {forbidden}')

      - name: Verify Tor Browser Portable profile contract
        shell: python
        run: |
          from pathlib import Path
          portable = Path('installer/ghosium-portable.nsi').read_text(encoding='utf-8')
          launcher = Path('compat-preview/launcher/main.cpp').read_text(encoding='utf-8')
          qa = Path('.github/workflows/ghosium-0.0.9-quality.yml').read_text(encoding='utf-8')
          for required in ('--ghosium-portable-profile','Ghosium-Portable-Data','PORTABLE_READY_MARKER'):
              if required not in portable:
                  raise SystemExit(f'Portable package contract missing: {required}')
          for required in ('firefox.exe', 'L"-profile"', 'kPortableProfilePrefix'):
              if required not in launcher:
                  raise SystemExit(f'Firefox launcher contract missing: {required}')
          if "'-profile'" not in qa or 'runtime/firefox.exe' not in qa:
              raise SystemExit('Windows QA does not exercise the Firefox Portable profile/runtime contract.')

      - name: Verify Tor Browser production packaging and signing
        shell: python
        run: |
          from pathlib import Path
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')
          production = Path('.github/workflows/ghosium-0.0.9-production-release.yml').read_text(encoding='utf-8')
          for required in ('firefox.exe','Ghosium-Browser-Setup.exe','Ghosium-Browser-Portable.exe','GHOSIUM-TOR-BROWSER-WINDOWS.json'):
              if required not in builder:
                  raise SystemExit(f'Candidate packaging missing: {required}')
          for required in ('GHOSIUM_SIGN_CERT_THUMBPRINT','GHOSIUM_TIMESTAMP_URL','signtool.exe','Get-AuthenticodeSignature','gh release create'):
              if required not in production:
                  raise SystemExit(f'Production signing/publication contract missing: {required}')

      - name: Verify formatting
        shell: bash
        run: git diff --check

  lifecycle-smoke:
    name: Compile and verify same-Setup lifecycle
    needs: contract
    runs-on: windows-2025
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Run installer lifecycle fixture
        shell: pwsh
        run: ./scripts/smoke-test-installer-contract-fixture.ps1
