name: Ghosium Security and Stability Hardening Contract

on:
  pull_request:
    branches: [main]
    paths:
      - 'installer/**'
      - 'compat-preview/launcher/**'
      - 'extension/newtab.html'
      - 'extension/newtab.css'
      - 'engine/tor-browser/**'
      - 'scripts/bootstrap-tor-browser-source.ps1'
      - 'scripts/rebrand-tor-browser-source.ps1'
      - 'scripts/verify-tor-browser-branding.ps1'
      - 'scripts/resolve-nsis.ps1'
      - 'scripts/generate-update-manifest.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - 'scripts/smoke-test-installer-contract-fixture.ps1'
      - '.github/workflows/tor-browser-windows-build.yml'
      - '.github/workflows/hardening-contract.yml'
  push:
    branches: [main]
    paths:
      - 'installer/**'
      - 'compat-preview/launcher/**'
      - 'extension/newtab.html'
      - 'extension/newtab.css'
      - 'engine/tor-browser/**'
      - 'scripts/bootstrap-tor-browser-source.ps1'
      - 'scripts/rebrand-tor-browser-source.ps1'
      - 'scripts/verify-tor-browser-branding.ps1'
      - 'scripts/resolve-nsis.ps1'
      - 'scripts/generate-update-manifest.ps1'
      - 'scripts/smoke-test-windows-installer.ps1'
      - 'scripts/smoke-test-installer-contract-fixture.ps1'
      - '.github/workflows/tor-browser-windows-build.yml'
      - '.github/workflows/hardening-contract.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hardening-contract:
    name: Verify Tor Firefox build installer and UI hardening
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1

      - name: Parse active PowerShell tooling
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($path in @(
            'scripts/bootstrap-tor-browser-source.ps1',
            'scripts/rebrand-tor-browser-source.ps1',
            'scripts/verify-tor-browser-branding.ps1',
            'scripts/resolve-nsis.ps1',
            'scripts/generate-update-manifest.ps1',
            'scripts/smoke-test-windows-installer.ps1',
            'scripts/smoke-test-installer-contract-fixture.ps1'
          )) {
            $tokens = $null
            $errors = $null
            [void][System.Management.Automation.Language.Parser]::ParseFile(
              (Resolve-Path $path), [ref]$tokens, [ref]$errors)
            if ($errors.Count -gt 0) {
              $errors | ForEach-Object { Write-Error "${path}: $($_.Message)" }
              throw "PowerShell parser errors found in $path"
            }
          }

      - name: Verify Tor Browser source and Windows compile hardening
        shell: python
        run: |
          from pathlib import Path
          builder = Path('.github/workflows/tor-browser-windows-build.yml').read_text(encoding='utf-8')
          for required in (
              'rustup target add x86_64-pc-windows-msvc',
              'ac_add_options --target=x86_64-pc-windows-msvc',
              'ac_add_options --with-base-browser-version=15.0.24',
              'export CFLAGS="-DNOMINMAX"',
              'export CXXFLAGS="-DNOMINMAX"',
              'MOZ_MAKE_FLAGS="-j2"',
              'CARGO_BUILD_JOBS: "2"',
              './scripts/rebrand-tor-browser-source.ps1',
              './scripts/verify-tor-browser-branding.ps1',
              './mach build',
              './mach package',
          ):
              if required not in builder:
                  raise SystemExit(f'Tor Firefox build hardening invariant missing: {required}')
          if 'cancel-in-progress: false' not in builder:
              raise SystemExit('Long Tor Firefox build must not be canceled by a newer run.')

      - name: Verify existing Ghosium UI and logo are source-ported
        shell: python
        run: |
          from pathlib import Path
          html = Path('extension/newtab.html').read_text(encoding='utf-8')
          css = Path('extension/newtab.css').read_text(encoding='utf-8')
          rebrand = Path('scripts/rebrand-tor-browser-source.ps1').read_text(encoding='utf-8')
          verify = Path('scripts/verify-tor-browser-branding.ps1').read_text(encoding='utf-8')
          for token in ('GHOSIUM BROWSER', 'Browse freely.', 'Stay private.', 'duckduckgo.com'):
              if token not in html:
                  raise SystemExit(f'Canonical Ghosium New Tab token missing: {token}')
          for token in ('--bg: #111016', '--aurora: #8af0c7', '--neon: #62e7d5', '.product-nav', '.search'):
              if token not in css:
                  raise SystemExit(f'Canonical Ghosium New Tab design token missing: {token}')
          for token in (
              'browser/extensions/newtab',
              'prerendered/activity-stream.html',
              'css/activity-stream.css',
              'ghosium-mark.svg',
              'extension/icons/128.png',
          ):
              if token not in rebrand:
                  raise SystemExit(f'Firefox source UI port invariant missing: {token}')
          if 'Chromium-extension-only runtime surfaces' not in verify:
              raise SystemExit('Tor Firefox branding verifier does not reject legacy Chromium UI references.')

      - name: Verify NSIS supply chain
        shell: python
        run: |
          from pathlib import Path
          text = Path('scripts/resolve-nsis.ps1').read_text(encoding='utf-8')
          for required in (
              'https://downloads.sourceforge.net/project/nsis/NSIS%203/3.12/nsis-3.12.zip',
              '56581f90db321581c5381193d796fffcf2d24b2f8fed2160a6c6a3baa67f2c4f',
              'Test-TrustedProgramFilesPath',
              'Test-PinnedArchive',
              'Get-FileHash $archive -Algorithm SHA256',
          ):
              if required not in text:
                  raise SystemExit(f'NSIS supply-chain invariant missing: {required}')

      - name: Verify atomic manifest and installer lifecycle hardening
        shell: python
        run: |
          from pathlib import Path
          manifest = Path('scripts/generate-update-manifest.ps1').read_text(encoding='utf-8')
          installer = Path('installer/ghosium.nsi').read_text(encoding='utf-8')
          smoke = Path('scripts/smoke-test-windows-installer.ps1').read_text(encoding='utf-8')
          fixture = Path('scripts/smoke-test-installer-contract-fixture.ps1').read_text(encoding='utf-8')

          for required in (
              "[IO.Path]::GetRandomFileName()",
              '[IO.File]::Move($tempOutput, $outputFullPath, $true)',
              'Assert-ManifestContent -Path $tempOutput',
              '$finalSha256 = (Get-FileHash $resolvedSetup -Algorithm SHA256).Hash.ToLowerInvariant()',
          ):
              if required not in manifest:
                  raise SystemExit(f'Atomic update-manifest invariant missing: {required}')

          for required in (
              '${GetOptions} $R0 "/UPDATE" $R1',
              '${GetOptions} $R0 "/UNINSTALL" $R1',
              '${GetOptions} $R0 "/CLEANUPDATE=" $R1',
              'Delete /REBOOTOK "$R5"',
              'Ghosium-Browser-Setup.exe',
          ):
              if required not in installer:
                  raise SystemExit(f'Same-Setup maintenance invariant missing: {required}')
          for forbidden in ('Local State', '\\User Data', 'Ghosium-Updater.exe', 'Ghosium-Update.exe'):
              if forbidden.lower() in installer.lower():
                  raise SystemExit(f'Retired Chromium/standalone maintenance residue: {forbidden}')

          for required in ('secureSessionStaging = $true', 'sessionDirectoryCleanupCompleted'):
              if required not in smoke:
                  raise SystemExit(f'Installer smoke hardening invariant missing: {required}')
          if 'Remove-Item $work -Recurse -Force -ErrorAction SilentlyContinue' not in fixture:
              raise SystemExit('Installer fixture cleanup invariant missing.')

      - name: Verify repository formatting
        shell: bash
        run: git diff --check
