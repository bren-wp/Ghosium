name: Ghosium Cross-Platform Quality Gate

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - 'ghosium/**'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ghosium-release-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  product-contract:
    name: Verify synchronized product and security contracts
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Verify product contracts
        shell: python
        run: |
          import json, re
          from pathlib import Path
          version = Path('VERSION').read_text(encoding='utf-8').strip()
          if not re.fullmatch(r'0\.\d+\.\d+', version):
              raise SystemExit(f'Invalid VERSION: {version!r}')
          extension = json.loads(Path('extension/manifest.json').read_text(encoding='utf-8'))
          if extension.get('version') != version or extension.get('manifest_version') != 3:
              raise SystemExit('Extension version/manifest contract failed.')
          store = json.loads(Path('store-web/storage/data/extensions.json').read_text(encoding='utf-8'))
          for item in store.get('extensions', []):
              if item.get('status') == 'built_in' and item.get('version') != version:
                  raise SystemExit('Store built-in version mismatch.')
          stable = json.loads(Path('updates-web/windows/stable.json').read_text(encoding='utf-8'))
          if stable.get('version') != version or stable.get('enabled') is not False or stable.get('sha256') or stable.get('size') != 0:
              raise SystemExit('Stable updater must remain synchronized and fail-closed.')
          android = Path('android/app/build.gradle').read_text(encoding='utf-8')
          name = re.search(r"versionName\s+'([^']+)'", android)
          code = re.search(r'versionCode\s+(\d+)', android)
          if not name or name.group(1) != version or not code or int(code.group(1)) < 1:
              raise SystemExit('Android version contract failed.')
          for token in ('compileSdk 36','targetSdk 36','minSdk 29',
                        "androidx.appcompat:appcompat:1.8.0",
                        "com.google.android.material:material:1.14.0"):
              if token not in android:
                  raise SystemExit(f'Android build contract missing: {token}')
          source = Path('android/app/src/main/java/com/brendigo/ghosium/MainActivity.java').read_text(encoding='utf-8')
          for token in ('setAcceptThirdPartyCookies(webView, false)','MIXED_CONTENT_NEVER_ALLOW',
                        'handler.cancel()','setAllowFileAccess(false)','setAllowContentAccess(false)',
                        'setSafeBrowsingEnabled(true)','onRenderProcessGone'):
              if token not in source:
                  raise SystemExit(f'Android security invariant missing: {token}')
          if '[INSERT ' in Path('LICENSE').read_text(encoding='utf-8'):
              raise SystemExit('LICENSE still contains placeholder legal values.')
      - name: Verify repository formatting
        shell: bash
        run: |
          set -euo pipefail
          git diff --check

  android:
    name: Android unit lint and release assembly
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
          fetch-depth: 1
      - name: Select JDK 17 and install pinned Android SDK
        shell: bash
        run: |
          set -euo pipefail
          echo "JAVA_HOME=$JAVA_HOME_17_X64" >> "$GITHUB_ENV"
          echo "$JAVA_HOME_17_X64/bin" >> "$GITHUB_PATH"
          sdkmanager_bin="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          set +o pipefail
          yes | "$sdkmanager_bin" 'platforms;android-36' 'build-tools;36.0.0' >/dev/null
          status=${PIPESTATUS[1]}
          set -o pipefail
          exit "$status"
      - name: Download and verify Gradle 8.13
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --show-error --silent --location --retry 5 --proto '=https' --proto-redir '=https' \
            https://services.gradle.org/distributions/gradle-8.13-bin.zip -o "$RUNNER_TEMP/gradle.zip"
          echo '20f1b1176237254a6fc204d8434196fa11a4cfb387567519c61556e8710aed78  '$RUNNER_TEMP'/gradle.zip' | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-8.13/bin" >> "$GITHUB_PATH"
      - name: Test lint minify and assemble
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon -p android testDebugUnitTest lintDebug lintRelease assembleDebug assembleRelease
          test -s android/app/build/outputs/apk/debug/app-debug.apk
          find android/app/build/outputs/apk/release -maxdepth 1 -type f -name 'app-release*.apk' -size +0c | grep -q .
